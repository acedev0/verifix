<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d">
  <title id="t">VeriFix: Neurosymbolic Code Vulnerability &amp; Bug Patcher</title>
  <desc id="d">Dual-engine CEGIS feedback loop uniting LLM generative patching with Z3 SMT formal verification</desc>
  <style>
    .title { font-family: "Avenir Next", "Segoe UI Variable Display", "Segoe UI", "SF Pro Display", system-ui, -apple-system, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -1.5px; fill: #f0f6fc; }
    .subtitle { font-family: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", "SF Pro Text", system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 500; fill: #94a3b8; }
    .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "SF Mono", monospace; font-size: 12px; font-weight: 500; }
    .badge-text { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }
    @keyframes flowRight {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowLeft {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }
    .flow-line-right { stroke-dasharray: 6 4; animation: flowRight 2s linear infinite; }
    .flow-line-left { stroke-dasharray: 6 4; animation: flowLeft 2s linear infinite; }
    .glow-aura { animation: pulseGlow 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .flow-line-right, .flow-line-left, .glow-aura { animation: none; }
    }
  </style>

  <defs>
    <radialGradient id="bgGlowIndigo" cx="220" cy="190" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowEmerald" cx="780" cy="190" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topAura" cx="500" cy="50" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect width="1000" height="280" rx="18"/>
    </clipPath>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="smtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <g clip-path="url(#cardClip)">
    <rect width="1000" height="280" fill="#090d16"/>
    <rect width="1000" height="280" fill="url(#topAura)"/>
    <rect width="1000" height="280" fill="url(#bgGlowIndigo)" class="glow-aura"/>
    <rect width="1000" height="280" fill="url(#bgGlowEmerald)" class="glow-aura"/>
    
    <!-- Subtle Grid Lines -->
    <path d="M0 70 H1000 M0 140 H1000 M0 210 H1000" stroke="#162032" stroke-width="0.75" stroke-opacity="0.4"/>
    <path d="M200 0 V280 M400 0 V280 M600 0 V280 M800 0 V280" stroke="#162032" stroke-width="0.75" stroke-opacity="0.4"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="17.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Header Section -->
  <g transform="translate(60, 44)">
    <!-- Small Category Chip -->
    <rect x="0" y="0" width="168" height="22" rx="11" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <circle cx="10" cy="11" r="3.5" fill="#818cf8"/>
    <text class="badge-text" x="20" y="15" fill="#c7d2fe">Neurosymbolic AI</text>

    <!-- Main Title -->
    <text class="title" x="0" y="60">VeriFix</text>
    <text class="subtitle" x="210" y="56">LLM Synthesis ⟷ Z3 SMT Formal Verification</text>
  </g>

  <!-- CEGIS Feedback Loop Visualization -->
  <g transform="translate(60, 138)">
    <!-- Engine 1 Box: Generative LLM -->
    <rect x="0" y="0" width="250" height="92" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="3" rx="1.5" fill="url(#llmGrad)"/>
    <circle cx="24" cy="28" r="6" fill="#6366f1" fill-opacity="0.25"/>
    <circle cx="24" cy="28" r="3" fill="#818cf8"/>
    <text class="badge-text" x="38" y="32" fill="#a5b4fc">ENGINE 1 · GENERATOR</text>
    <text class="mono" x="24" y="56" fill="#e2e8f0" font-weight="700">LLM Patch Synthesis</text>
    <text class="mono" x="24" y="74" fill="#64748b" font-size="11">Gemini Pro / Scripted CEGIS</text>

    <!-- Loop Forward Arrow (Patch Candidate) -->
    <path d="M 260 30 H 620" fill="none" stroke="#38bdf8" stroke-width="1.8" class="flow-line-right"/>
    <polygon points="622,30 614,25 614,35" fill="#38bdf8"/>
    <rect x="365" y="16" width="150" height="22" rx="6" fill="#09182a" stroke="#0284c7" stroke-width="0.8"/>
    <text class="mono" x="440" y="31" fill="#7dd3fc" font-size="10.5" text-anchor="middle">Candidate Patch (AST)</text>

    <!-- Loop Backward Arrow (Counterexample Feedback) -->
    <path d="M 620 64 H 260" fill="none" stroke="#f59e0b" stroke-width="1.8" class="flow-line-left"/>
    <polygon points="258,64 266,59 266,69" fill="#f59e0b"/>
    <rect x="345" y="53" width="190" height="22" rx="6" fill="#201506" stroke="#b45309" stroke-width="0.8"/>
    <text class="mono" x="440" y="68" fill="#fcd34d" font-size="10.5" text-anchor="middle">SMT Counterexample (Inputs)</text>

    <!-- Engine 2 Box: SMT Formal Verifier -->
    <rect x="630" y="0" width="250" height="92" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="630" y="0" width="250" height="3" rx="1.5" fill="url(#smtGrad)"/>
    <circle cx="654" cy="28" r="6" fill="#10b981" fill-opacity="0.25"/>
    <circle cx="654" cy="28" r="3" fill="#34d399"/>
    <text class="badge-text" x="668" y="32" fill="#6ee7b7">ENGINE 2 · VERIFIER</text>
    <text class="mono" x="654" y="56" fill="#e2e8f0" font-weight="700">Z3 SMT Solver</text>
    <text class="mono" x="654" y="74" fill="#64748b" font-size="11">Sound Proof: ¬Spec is UNSAT</text>
  </g>

  <!-- Footer Captions -->
  <text class="mono" x="60" y="258" fill="#475569">Theorem: Φ_path ∧ Φ_pre ∧ ¬Φ_post ⟹ UNSAT</text>
  <text class="mono" x="940" y="258" text-anchor="end" fill="#10b981">✓ 47/47 Formal Tests Verified Sound</text>
</svg>
